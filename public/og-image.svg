<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient background glow blobs -->
  <circle cx="200" cy="150" r="180" fill="#2563eb" opacity="0.3" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#7c3aed" opacity="0.25" filter="url(#glow)" />

  <!-- Grid decoration lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Brand Badge & Logo -->
  <g transform="translate(100, 100)">
    <!-- Logo Icon Box -->
    <rect width="84" height="84" rx="24" fill="url(#accentGrad)" />
    <!-- Paper Plane Icon -->
    <g transform="translate(20, 20) scale(1.9)">
      <path
        d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <!-- App Name & Version -->
    <text x="110" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="-0.5">
      OmniPost
    </text>
    <rect x="330" y="24" width="130" height="34" rx="17" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1" />
    <text x="395" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#93c5fd" text-anchor="middle">
      v1.0.0 SUITE
    </text>
  </g>

  <!-- Hero Headline -->
  <text x="100" y="290" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1">
    Tek Tıkla 7 Platforma
  </text>
  <text x="100" y="355" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="url(#accentGrad)" letter-spacing="-1">
    Eşzamanlı Sosyal Medya Dağıtımı
  </text>

  <!-- Subheadline -->
  <text x="100" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    YouTube • X (Twitter) • Instagram • Facebook • TikTok • Pinterest • Threads
  </text>

  <!-- Feature Pills Footer -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="110" y="32" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#e2e8f0" text-anchor="middle">
      🔒 AES-256 Token Kasası
    </text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="230" height="52" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="355" y="32" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#e2e8f0" text-anchor="middle">
      ⚡ İzole Dağıtım Motoru
    </text>

    <!-- Pill 3 -->
    <rect x="490" y="0" width="230" height="52" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="605" y="32" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#e2e8f0" text-anchor="middle">
      📅 Akıllı Takvim & Kuyruk
    </text>

    <!-- Pill 4 -->
    <rect x="740" y="0" width="230" height="52" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="855" y="32" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#e2e8f0" text-anchor="middle">
      📊 Konsolide Analitik
    </text>
  </g>
</svg>
