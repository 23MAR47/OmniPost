<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="omniTgFavGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2BB8FF"/>
      <stop offset="45%" stop-color="#229ED9"/>
      <stop offset="100%" stop-color="#1E6FD9"/>
    </linearGradient>
    <radialGradient id="omniFavGlare" cx="35%" cy="25%" r="65%">
